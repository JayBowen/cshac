<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Civil Service Harriers</title>
    <script type="text/javascript">
      // GitHub Pages has no SPA rewrite, so a deep link / refresh on /cshac/history
      // hits this 404. We encode the path into a query and bounce to the app root,
      // where the decoder in index.html restores the real URL for React Router.
      // Technique: https://github.com/rafgraph/spa-github-pages
      // pathSegmentsToKeep = 1 keeps the "/cshac" project-site prefix.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
