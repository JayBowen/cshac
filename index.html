<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/crest.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Civil Service Harriers — founded 1867, Ireland's oldest athletic club. Running out of the Phoenix Park, Dublin."
    />
    <!-- Open Graph / Twitter card — controls the preview shown when the link is shared
         (WhatsApp, iMessage, Facebook, Slack, X, …). og:url and og:image must be absolute
         because the sharing app fetches them from its own servers, and Vite does not rewrite
         meta content for the /cshac/ base path — so these are hardcoded to the Pages URL.
         TODO(polish): swap og:image for a dedicated ~1200×630 share image when one exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Civil Service Harriers AC" />
    <meta property="og:title" content="Civil Service Harriers AC" />
    <meta
      property="og:description"
      content="Ireland's oldest athletic club — founded 1867, running out of the Phoenix Park, Dublin."
    />
    <meta property="og:url" content="https://jaybowen.github.io/cshac/" />
    <meta property="og:image" content="https://jaybowen.github.io/cshac/crest.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Civil Service Harriers crest" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Civil Service Harriers AC" />
    <meta
      name="twitter:description"
      content="Ireland's oldest athletic club — founded 1867, running out of the Phoenix Park, Dublin."
    />
    <meta name="twitter:image" content="https://jaybowen.github.io/cshac/crest.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Civil Service Harriers · Est. 1867</title>
    <script type="text/javascript">
      // Decode the path that public/404.html stashed in the query string, so a
      // deep-linked GitHub Pages URL lands on the right React Router route.
      // Technique: https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
