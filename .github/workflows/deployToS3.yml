name: Deploy to S3

# Prod deploy: run manually from the Actions tab once the Pages (pre-prod) deploy
# from a push to main looks good.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: cshac-prod
  CLOUDFRONT_DISTRIBUTION_ID: E28MUG9CFOYMS5

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GALLERY_BASE_URL is a repo variable pointing at the gallery bucket's CDN origin.
      - name: Build
        run: npm run build
        env:
          VITE_GALLERY_BASE_URL: ${{ vars.GALLERY_BASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::211107604636:role/github-actions-react-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"